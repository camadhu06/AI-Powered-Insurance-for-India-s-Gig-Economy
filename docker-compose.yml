version: '3.8'

services:
  ml-server:
    build: 
      context: ./ml
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  backend:
    build: 
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - ML_SERVICE_URL=http://ml-server:8000
    env_file:
      - ./backend/.env
    depends_on:
      - ml-server

  admin-web:
    build: 
      context: ./admin-web
      args:
        - REACT_APP_API_URL=http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend
